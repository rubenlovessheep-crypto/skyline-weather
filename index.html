<style>
:root{color-scheme:dark;--ink:#fff;--soft:rgba(255,255,255,.68);--glass:rgba(12,20,40,.10);--line:rgba(255,255,255,.2);
--serif:'Instrument Serif',Georgia,serif;--sans:'Manrope',system-ui,-apple-system,'Segoe UI',sans-serif}
*{box-sizing:border-box;margin:0}
html,body{min-height:100%}
body{font-family:var(--sans);color:var(--ink);background:#1d2b4a;-webkit-font-smoothing:antialiased;overflow-x:hidden}
#sky{position:fixed;inset:0;z-index:-2;transition:opacity .8s}
#fx{position:fixed;inset:0;z-index:-1;pointer-events:none;width:100%;height:100%}
.cloud{position:fixed;z-index:-1;border-radius:50%;background:rgba(255,255,255,.16);filter:blur(60px);animation:drift 60s linear infinite alternate;pointer-events:none}
@keyframes drift{to{transform:translateX(18vw)}}
main{max-width:1040px;margin:0 auto;padding:max(20px,env(safe-area-inset-top)) 20px max(32px,env(safe-area-inset-bottom))}
header{display:flex;gap:10px;align-items:center;position:relative}
.search{flex:1;position:relative}
.search input{width:100%;padding:14px 20px 14px 46px;border-radius:99px;border:1px solid var(--line);background:var(--glass);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);color:#fff;font:500 .95rem var(--sans);outline:none}
.search input::placeholder{color:var(--soft)}
.search input:focus-visible,.btn:focus-visible,.hit:focus-visible{outline:2px solid #fff;outline-offset:2px}
.search svg{position:absolute;left:17px;top:15px;width:18px;height:18px;opacity:.75}
.btn{height:46px;min-width:46px;padding:0 16px;border-radius:99px;border:1px solid var(--line);background:var(--glass);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);color:#fff;font:600 .85rem var(--sans);cursor:pointer;display:grid;place-items:center;transition:background .2s}
.btn:hover{background:rgba(255,255,255,.24)}

 if(/tomorrow|morgen/.test(q)){off=1;named=true}else{for(let k=0;k<d.time.length;k++){const w=new Date(d.time[k]+'T12:00').getDay();if(q.includes(WE[w])||q.includes(WN[w])){off=k;named=true;break}}}
 const m=q.match(/\b(?:at|om|around|rond)\s*(\d{1,2})(?::(\d{2}))?\s*(am|pm)?/);
 if(m){hour=+m[1];if(m[3]==='pm'&&hour<12)hour+=12;else if(m[3]==='am'&&hour===12)hour=0;else if(!m[3]&&hour>=1&&hour<=6&&!/morning|ochtend/.test(q))hour+=12}
 else if(/tonight|vanavond|vannacht/.test(q))hour=22;else if(/evening|avond/.test(q))hour=19;else if(/afternoon|middag/.test(q))hour=15;else if(/morning|ochtend/.test(q))hour=8;else if(named)hour=12;
 let i=hour==null&&off===0?hrIdx():h.time.indexOf(`${d.time[off]}T${pad2(Math.min(23,hour==null?12:hour))}:00`);if(i<0)i=hrIdx();
 const w=wxIdx(h,i),hh=h.time[i].slice(11,16),dayN=off===0?L('today','vandaag'):off===1?L('tomorrow','morgen'):new Date(d.time[off]+'T12:00').toLocaleDateString(LOC(),{weekday:'long'}),when=hour==null&&off===0?L('right now','op dit moment'):`${dayN} ${L('at','om')} ${hh}`,lab=tr(kind(w.code)[0]).toLowerCase(),kmh=Math.round(w.wd),gu=Math.round(w.gust);
 if(/umbrella|rain|shower|dry|wet|paraplu|regen|nat\b|droog|bui/.test(q))return w.pop>=60?L(`Yes, take an umbrella. There is a ${w.pop}% chance of rain ${when}.`,`Ja, neem een paraplu mee. Er is ${w.pop}% kans op regen ${when}.`):w.pop>=30?L(`Maybe. There is a ${w.pop}% chance of rain ${when}, so a small umbrella can’t hurt.`,`Misschien. Er is ${w.pop}% kans op regen ${when}, dus een klein paraplutje kan geen kwaad.`):L(`No, it should stay dry ${when} (${w.pop}% chance of rain).`,`Nee, het blijft ${when} waarschijnlijk droog (${w.pop}% kans op regen).`);
 if(/bike|cycl|fiets/.test(q))return L(`Cycling ${when}: ${T(w.t)}°, wind ${kmh} km/h (gusts ${gu}) and ${w.pop}% chance of rain. ${w.pop>=50||kmh>=30?'Not ideal, I would pick another time.':'Looks good for a ride.'}`,`Fietsen ${when}: ${T(w.t)}°, wind ${kmh} km/u (vlagen ${gu}) en ${w.pop}% kans op regen. ${w.pop>=50||kmh>=30?'Niet ideaal, ik zou een ander moment kiezen.':'Prima weer voor een fietstocht.'}`);
 if(/uv|sunscreen|sunburn|zonnebrand|smeren/.test(q))return w.uv>=3?L(`UV is ${w.uv.toFixed(1)} ${when}. Yes, put on sunscreen.`,`De UV-index is ${w.uv.toFixed(1)} ${when}. Ja, smeer je in.`):L(`UV is only ${w.uv.toFixed(1)} ${when}. Sunscreen is not really needed.`,`De UV-index is maar ${w.uv.toFixed(1)} ${when}. Insmeren is niet echt nodig.`);
 if(/snow|frost|ice|icy|sneeuw|vorst|ijs\b/.test(q))return w.t<=1?L(`It is ${T(w.t)}° ${when}, so frost or ice is possible. ${lab}.`,`Het is ${T(w.t)}° ${when}, dus vorst of gladheid is mogelijk. ${lab}.`):L(`It is ${T(w.t)}° ${when}. No frost or snow expected (${lab}).`,`Het is ${T(w.t)}° ${when}. Geen vorst of sneeuw verwacht (${lab}).`);
 if(/sunrise|sunset|zonsopkomst|zonsondergang|dark|donker/.test(q))return L(`On ${dayN} the sun rises at ${d.sunrise[off].slice(11,16)} and sets at ${d.sunset[off].slice(11,16)}.`,`${dayN[0].toUpperCase()+dayN.slice(1)} komt de zon op om ${d.sunrise[off].slice(11,16)} en gaat onder om ${d.sunset[off].slice(11,16)}.`);
 if(/wind|gust|storm|waait|blaast/.test(q))return L(`Wind ${when}: ${kmh} km/h with gusts up to ${gu} km/h. ${gu>=50?'That is strong, be careful.':kmh>=25?'Quite breezy.':'Fairly calm.'}`,`Wind ${when}: ${kmh} km/u met vlagen tot ${gu} km/u. ${gu>=50?'Dat is stevig, pas op.':kmh>=25?'Best winderig.':'Vrij rustig.'}`);
 if(/wear|jacket|coat|cold|warm|hot|temperature|degrees|jas\b|kou|aantrekken|temperatuur|graden|koud|heet/.test(q)){const ch=cmChips(w).map(x=>tr(x.replace(/^\S+\s/,'')).toLowerCase());return L(`${T(w.t)}° ${when}, ${lab}. ${ch.length?'Wear or bring: '+ch.join(', ')+'.':'No special clothing needed.'}`,`${T(w.t)}° ${when}, ${lab}. ${ch.length?'Trek aan of neem mee: '+ch.join(', ')+'.':'Geen speciale kleding nodig.'}`)}
 if(/sun|cloud|clear|sky|zon\b|zonnig|bewolkt|lucht/.test(q))return L(`${when[0].toUpperCase()+when.slice(1)} it is ${lab} at ${T(w.t)}°.`,`${when[0].toUpperCase()+when.slice(1)} is het ${lab} bij ${T(w.t)}°.`);
 return L(`${when[0].toUpperCase()+when.slice(1)}: ${lab}, ${T(w.t)}°, ${w.pop}% chance of rain and wind ${kmh} km/h.`,`${when[0].toUpperCase()+when.slice(1)}: ${lab}, ${T(w.t)}°, ${w.pop}% kans op regen en wind ${kmh} km/u.`)}
function renderAsk(){const el=$('#ask');if(!el||!data)return;const ex=[L('Do I need an umbrella at 5?','Heb ik om 5 uur een paraplu nodig?'),L('What should I wear tomorrow morning?','Wat trek ik morgenochtend aan?'),L('Is it windy tonight?','Waait het vanavond hard?'),L('When is sunset tomorrow?','Hoe laat is de zonsondergang morgen?')];
 el.innerHTML=`<h2>${L('Ask the weather','Vraag het weer')}</h2><div class="askf"><input class="tin" id="askq" type="text" placeholder="${L('Ask anything…','Vraag maar raak…')}" autocomplete="off" enterkeyhint="send"><button class="btn mini" id="asks">${L('Ask','Vraag')}</button></div>
 <div class="askc">${ex.map((x,i)=>`<button class="chip notip" data-i="${i}">${x}</button>`).join('')}</div><div class="askb" id="askb">${ASK.a?`<div class="you">${esc(ASK.q)}</div><div class="bot">${ASK.a}</div>`:`<div class="bot soft">${L('Try one of the questions above, or type your own.','Probeer een van de vragen hierboven of typ je eigen vraag.')}</div>`}</div>`;
 const go=q=>{q=q.trim();if(!q)return;ASK.q=q;$('#askb').innerHTML=`<div class="you">${esc(q)}</div><div class="bot"><span class="dots"><i></i><i></i><i></i></span></div>`;setTimeout(()=>{try{ASK.a=askAnswer(q)}catch(e){ASK.a=L('Sorry, I could not work that one out.','Sorry, dat kon ik niet uitrekenen.')}renderAsk()},LITE?0:480)};
 $('#asks').onclick=()=>go($('#askq').value);$('#askq').onkeydown=e=>{if(e.key==='Enter')go(e.target.value)};
 el.querySelectorAll('.askc .chip').forEach(b=>b.onclick=()=>go(ex[+b.dataset.i]))}
// ---------- locating: IP (approximate) and browser GPS (precise) ----------
async function ipLocate(){
 for(const u of['https://ipwho.is/','https://ipapi.co/json/']){try{const r=await(await fetch(u)).json(),lat=r.latitude,lon=r.longitude;if(r.success===false||lat==null||lon==null)continue;
  return{name:r.city||r.region||'Your area',sub:r.country||r.country_name||'',lat:+lat,lon:+lon,src:'ip'}}catch(e){}}
 return null}
function gpsLocate(){return new Promise((res,rej)=>{if(!navigator.geolocation)return rej({code:0});
 navigator.geolocation.getCurrentPosition(async p=>{let n='Your location',s='';
  try{const r=await(await fetch(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${p.coords.latitude}&longitude=${p.coords.longitude}&localityLanguage=en`)).json();n=r.city||r.locality||n;s=r.countryName||''}catch(e){}
  res({name:n,sub:s,lat:p.coords.latitude,lon:p.coords.longitude,src:'gps'})},e=>rej(e),{timeout:9000,maximumAge:600000})})}
async function locate(){toast('Finding you…',3000);
 try{load(await gpsLocate())}
 catch(e){const p=await ipLocate();
  if(p){load(p);toast(e&&e.code===1?'Location permission was denied, so I used an approximate spot from your IP address.':'Couldn’t get a precise fix, so I used your IP address instead.',6500)}
  else toast('Couldn’t find your location. Search for a city instead.',5500)}}
(async()=>{
 if(place&&place.src!=='ip'){load(place);return}
 if(place){load(place);const p=await ipLocate();if(p&&(Math.abs(p.lat-place.lat)>.25||Math.abs(p.lon-place.lon)>.25)){load(p);toast(`Looks like you’ve moved. Now showing ${p.name}.`,5000)}return}
 const p=await ipLocate();load(p||{name:'Amsterdam',sub:'Netherlands',lat:52.37,lon:4.89});
 if(p)setTimeout(()=>toast('Showing your approximate location. Tap the location button for a precise one.',6500),2500)})();
if(location.hash==='#kiosk')enterKiosk(false);

// liquid glass: the light follows your finger or cursor
document.addEventListener('pointermove',e=>{if(e.pointerType==='touch')return;const b=e.target.closest&&e.target.closest('.btn,.msave,.mh button,.search input');if(!b)return;const r=b.getBoundingClientRect();b.style.setProperty('--mx',(e.clientX-r.left)+'px');b.style.setProperty('--my',(e.clientY-r.top)+'px')},{passive:true});
document.addEventListener('pointerout',e=>{const b=e.target.closest&&e.target.closest('.btn,.msave,.mh button,.search input');if(b&&!b.contains(e.relatedTarget)){b.style.removeProperty('--mx');b.style.removeProperty('--my')}},{passive:true});
</script>
